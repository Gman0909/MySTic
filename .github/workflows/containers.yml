name: containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: mystic-api:test

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: mystic-web:test
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000

      - name: Smoke test — API against Postgres + Meilisearch
        run: |
          # No `set -e`: every assertion goes through fail() so the reason is
          # visible in annotations (Actions logs need auth to read).
          MEILI_KEY=ci-master-key-0123456789abcdef   # Meili production mode needs >= 16 bytes
          fail() {
            echo "::error::$1"
            docker logs api 2>&1 | tail -7 | sed 's/^/::error::[api] /' || true
            exit 1
          }
          docker network create mystic || fail "network create failed"
          docker run -d --name pg --network mystic \
            -e POSTGRES_USER=mystic -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mystic \
            pgvector/pgvector:pg17 || fail "postgres container failed to start"
          docker run -d --name meili --network mystic -p 7700:7700 \
            -e MEILI_MASTER_KEY=$MEILI_KEY -e MEILI_ENV=production \
            getmeili/meilisearch:v1.15 || fail "meilisearch container failed to start"
          for i in $(seq 1 30); do docker exec pg pg_isready -U mystic > /dev/null 2>&1 && break; sleep 2; done
          docker exec pg pg_isready -U mystic > /dev/null 2>&1 || fail "Postgres never became ready"
          for i in $(seq 1 30); do curl -sf http://localhost:7700/health > /dev/null && break; sleep 2; done
          curl -sf http://localhost:7700/health > /dev/null || fail "Meilisearch never became ready ($(docker logs meili 2>&1 | tail -2 | tr '\n' ' '))"
          docker run -d --name api --network mystic -p 4000:4000 \
            -e DATABASE_URL=postgres://mystic:ci@pg:5432/mystic \
            -e MEILI_URL=http://meili:7700 -e MEILI_MASTER_KEY=$MEILI_KEY \
            -e MYSTIC_SKIP_SEED=1 \
            mystic-api:test || fail "api container failed to start"
          ok=""
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health > /dev/null && ok=1 && break
            sleep 2
          done
          [ -n "$ok" ] || fail "API never became healthy"
          echo "API healthy"
          REG=$(curl -s -X POST http://localhost:4000/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@test.local","password":"ci-password-123"}')
          echo "$REG" | grep -q '"token"' || fail "registration failed: $(echo "$REG" | head -c 300)"
          echo "registration (Postgres write + admin bootstrap) OK"
          SRCH=$(curl -s 'http://localhost:4000/api/search?q=test&mode=keyword')
          echo "$SRCH" | grep -q '"hits"' || fail "search failed: $(echo "$SRCH" | head -c 300)"
          echo "search (Meilisearch round-trip) OK"

      - name: Smoke test — web
        run: |
          set -e
          docker run -d --name web -p 3000:3000 mystic-web:test
          ok=""
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 > /dev/null && ok=1 && break
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::web never became healthy"
            docker logs web 2>&1 | tail -25 | sed 's/^/::error::[web] /'
            exit 1
          fi
          curl -sf http://localhost:3000 | grep -qi "mystic"
          echo "web serving OK"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          set -e
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          for name in api web; do
            docker tag mystic-$name:test ghcr.io/$OWNER/mystic-$name:latest
            docker tag mystic-$name:test ghcr.io/$OWNER/mystic-$name:$SHORT_SHA
            docker push ghcr.io/$OWNER/mystic-$name:latest
            docker push ghcr.io/$OWNER/mystic-$name:$SHORT_SHA
          done
