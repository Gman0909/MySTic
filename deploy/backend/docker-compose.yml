# MySTic backend stack for the "Netlify frontend + hosted backend" deployment.
# Runs the API, Meilisearch, and Postgres behind Caddy (automatic HTTPS).
#
#   cd deploy/backend
#   cp .env.example .env   # fill in secrets + your API domain
#   docker compose up -d
#
# See ../../DEPLOYMENT.md for the full runbook.
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mystic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mystic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystic"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mystic:${POSTGRES_PASSWORD}@postgres:5432/mystic
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      API_PORT: "4000"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://mystic.2i2c.org}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env (e.g. api.mystic.2i2c.org)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - api

volumes:
  pgdata:
  meilidata:
  caddydata:
