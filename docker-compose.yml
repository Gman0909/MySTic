# Production deployment for MySTic.
# Local development on a machine without Docker uses embedded PGlite + a local
# Meilisearch binary instead (see README) — same code, different DATABASE_URL.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: mystic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mystic}
      POSTGRES_DB: mystic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mystic"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://mystic:${POSTGRES_PASSWORD:-mystic}@postgres:5432/mystic
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      API_PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  meilidata:
